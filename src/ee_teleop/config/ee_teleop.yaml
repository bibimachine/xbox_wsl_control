ee_teleop:
  ros__parameters:
    publish_rate: 100.0       # 控制/发布频率 (Hz)，与 Servo/JTC 同频，避免命令量化台阶
    deadzone: 0.05            # 摇杆死区
    v_max_xy: 0.1             # 摇杆满偏线速度 (m/s)
    v_max_z: 0.1              # 按钮 Z 向速度 (m/s)
    omega_max: 1.5            # Y 键 wrist_roll 转速 (rad/s)，嫌慢继续加，URDF 上限 10
    wz_sign: -1.0             # Y 键旋转方向符号（-1 = 从 +Z 俯视顺时针为负）
    alpha: 0.12               # EMA 滤波系数；100Hz 下 ≈80ms 时间常数(手感等价旧 30Hz+0.3)，改频率要同步换算
    accel_max: 0.5            # 线加速度限幅 (m/s^2)
    angular_accel_max: 2.0    # 角加速度限幅 (rad/s^2)
    joy_timeout: 0.3          # 看门狗超时 (s)
    base_frame: 'base_link'   # 输出 TwistStamped 的 frame_id（base 竖直安装时其 xy 即平行地面）
    control_yaw: 0.0          # 摇杆"前"方向相对 base_link +X 的偏航角 (rad, 右手为正)，不对就试 ±1.5708
    wrist_joint: 'wrist_roll' # Y 键单关节旋转的关节名（JointJog 通道）
    joint_command_topic: '/servo_node/delta_joint_cmds'  # Servo 的 JointJog 输入话题
    enable_gripper: true      # 是否发夹爪指令
    gripper_open_value: 0.1   # 夹爪开指令值（effort 量纲，见 README）
    gripper_close_value: -0.1 # 夹爪合指令值
    vel_epsilon: 0.002        # 输出端微死区：线速度低于此值直接置 0，截断 EMA 衰减尾巴 (m/s)
    omega_epsilon: 0.01       # 输出端微死区：角速度低于此值直接置 0 (rad/s)
